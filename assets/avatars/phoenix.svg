 <g fill="none" stroke="#b0207a" stroke-width="2" stroke-linecap="round" opacity=".75"><path d="M54 62q5 5 10 0q5 5 10 0"/><path d="M55 70q4.5 5 9 0q4.5 5 9 0"/><path d="M57 78q3.5 4 7 0q3.5 4 7 0"/></g><path d="M50 52q14 8 28 0" stroke="#ffd54a" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="64" cy="56" r="3.4" fill="#7af4ff" stroke="#1a4a8a" stroke-width="1.6"/>
 <g opacity=".9"><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1s" repeatCount="indefinite"/><path d="M48 32c-8-6-8-16-4-22 0 8 6 10 8 14zM80 32c8-6 8-16 4-22 0 8-6 10-8 14z" fill="#ff7ad8" stroke="#5a0a6a" stroke-width="2" stroke-linejoin="round"/></g>
