  <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ad8"/><stop offset=".6" stop-color="#a03aff"/><stop offset="1" stop-color="#3a1aff" stop-opacity="0"/></linearGradient>
