 <circle cx="57" cy="35.4" r="1.2" fill="#fff"/><circle cx="71" cy="35.4" r="1.2" fill="#fff"/><path d="M50 31l10 3M78 31l-10 3" stroke="#5a0a6a" stroke-width="2.6" stroke-linecap="round"/>
