  <radialGradient id="aura" cx="50%" cy="55%" r="50%"><stop offset="0" stop-color="#ff6ad5" stop-opacity=".85"/><stop offset=".6" stop-color="#b03aff" stop-opacity=".35"/><stop offset="1" stop-color="#b03aff" stop-opacity="0"/></radialGradient>
  <linearGradient id="wingL" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0fb"/><stop offset=".3" stop-color="#ff7ad8"/><stop offset=".7" stop-color="#c03aff"/><stop offset="1" stop-color="#5a2aff"/></linearGradient>
