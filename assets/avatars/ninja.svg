<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
 <defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#5b2a8f"/><stop offset=".6" stop-color="#2a1150"/><stop offset="1" stop-color="#0e0620"/></radialGradient>
  <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f5c"/><stop offset="1" stop-color="#14162a"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9b8"/><stop offset="1" stop-color="#e8a57c"/></linearGradient>
  <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b5c"/><stop offset="1" stop-color="#c2123a"/></linearGradient>
  <radialGradient id="moonbg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe9c4"/><stop offset=".7" stop-color="#ffb3c8" stop-opacity=".5"/><stop offset="1" stop-color="#ffb3c8" stop-opacity="0"/></radialGradient>
 </defs>
 <rect width="128" height="128" fill="url(#bg)"/>
 <circle cx="64" cy="58" r="46" fill="url(#moonbg)" opacity=".55"/>
 <!-- shuriken behind -->
 <g transform="translate(104 24) rotate(20)" fill="#c9d2e8" stroke="#2a2f45" stroke-width="2"><path d="M0-13l3 10 10 3-10 3-3 10-3-10-10-3 10-3z"/><circle r="2.4" fill="#2a2f45"/></g>
 <!-- headband tails -->
 <path d="M96 52c10 2 18 10 22 22-7-5-14-8-21-8" fill="url(#band)" stroke="#5a0618" stroke-width="2.5" stroke-linejoin="round"/>
 <path d="M96 58c6 8 8 18 6 28-4-7-8-12-12-16" fill="#e01e44" stroke="#5a0618" stroke-width="2.5" stroke-linejoin="round"/>
 <!-- shoulders -->
 <path d="M18 128c2-22 20-34 46-34s44 12 46 34z" fill="url(#hood)" stroke="#07081a" stroke-width="3"/>
 <path d="M50 96l14 14 14-14" stroke="#ff3b5c" stroke-width="4" fill="none"/>
 <!-- head -->
 <ellipse cx="64" cy="60" rx="34" ry="36" fill="url(#hood)" stroke="#07081a" stroke-width="3.5"/>
 <path d="M38 44c8-14 44-14 52 0" stroke="#565d82" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
 <!-- eye slit -->
 <path d="M34 56q30-8 60 0v16q-30 6-60 0z" fill="url(#skin)" stroke="#07081a" stroke-width="3" stroke-linejoin="round"/>
 <!-- headband -->
 <path d="M31 46q33-10 66 0l-1 9q-32-9-64 0z" fill="url(#band)" stroke="#5a0618" stroke-width="2.5" stroke-linejoin="round"/>
 <rect x="56" y="42" width="16" height="10" rx="2" fill="#d8dde8" stroke="#3b4157" stroke-width="2"/>
 <!-- eyes -->
 <path d="M42 64q8-7 16-1q-8 6-16 1z" fill="#fff" stroke="#07081a" stroke-width="2"/><circle cx="51" cy="63.5" r="3.4" fill="#1a1030"/><circle cx="52.3" cy="62.3" r="1.2" fill="#fff"/>
 <path d="M86 64q-8-7-16-1q8 6 16 1z" fill="#fff" stroke="#07081a" stroke-width="2"/><circle cx="77" cy="63.5" r="3.4" fill="#1a1030"/><circle cx="78.3" cy="62.3" r="1.2" fill="#fff"/>
 <path d="M42 57l14 3M86 57l-14 3" stroke="#3a2010" stroke-width="3" stroke-linecap="round"/>
 <!-- mask folds -->
 <path d="M44 82q20 6 40 0" stroke="#565d82" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
</svg>
