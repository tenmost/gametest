<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Rock Paper Scissors 3D</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070c20;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;color:white}
main{width:min(100vw,1100px);padding:8px}
.stage{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:14px;box-shadow:0 0 30px #1e3a75;background:#090626;user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#nogl{position:absolute;inset:0;display:grid;place-items:center;color:#c7e9ff;font-size:14px}
.count{position:absolute;top:3.5%;left:42.1%;width:15.7%;height:20%;border-radius:50%;background:radial-gradient(circle,#191039cc 30%,#33176ccc 70%,#131f58cc 100%);border:3px solid #38caff;box-shadow:0 0 22px #168dfb,inset 0 0 17px #af36ff;display:grid;place-items:center;font-size:clamp(20px,6vw,77px);font-weight:900;text-shadow:0 0 10px #ff6cff}
.count.tick{animation:tick .3s ease-out}@keyframes tick{from{transform:scale(1.25)}to{transform:scale(1)}}
.label{position:absolute;top:1%;font-size:clamp(12px,2vw,26px);font-weight:900;text-shadow:0 2px 5px black}.label.p{left:2%}.label.c{right:2%}
.hearts{position:absolute;top:6.4%;font-size:clamp(12px,3.6vw,46px);color:#ff184f;letter-spacing:.08em;text-shadow:0 2px 5px #2b0020}.hearts.p{left:2%}.hearts.c{right:1.5%}
.hearts.hit{animation:hit .5s}@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.score{position:absolute;top:15%;font-size:clamp(9px,1.3vw,16px);font-weight:bold;color:#c7e9ff;text-shadow:0 1px 4px #000}.score.p{left:2%}.score.c{right:2%;text-align:right}
.controls button{position:absolute;top:80%;height:13%;width:15%;border:2px solid #7de7ff;border-radius:18px;background:linear-gradient(135deg,#122654d0,#50217dc0);box-shadow:0 0 13px #52d4ff99;cursor:pointer;color:white;font-size:clamp(10px,1.7vw,21px);font-weight:900;text-shadow:0 1px 4px #000;backdrop-filter:blur(2px)}
.controls button:hover:not(:disabled),.controls button:focus-visible{background:linear-gradient(135deg,#1d3b7cef,#6a2fa5df);outline:3px solid #fff8}
.controls button:disabled{opacity:.5;cursor:default}.controls button.picked{opacity:1;border-color:#fff;box-shadow:0 0 22px #fff}
.controls small{display:block;font-size:.55em;opacity:.7;margin-top:2px}
.controls .rock{left:25.7%}.controls .paper{left:42.5%}.controls .scissors{left:59.3%}
#status{position:absolute;top:26%;left:22%;width:56%;text-align:center;font-size:clamp(12px,2.6vw,29px);font-weight:900;text-shadow:0 2px 8px black;pointer-events:none}
#status.win{color:#6dffa8}#status.lose{color:#ff7a90}
.corner{position:absolute;bottom:1.5%;background:#112c65dd;border:1px solid #83dfff;border-radius:8px;color:white;padding:clamp(4px,1vw,10px);font-weight:bold;cursor:pointer;font-size:clamp(9px,1.1vw,14px)}
#restart{right:1%}#mute{left:1%}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}.flash.go{animation:fl .5s}@keyframes fl{0%{opacity:.3}100%{opacity:0}}
.overlay{position:absolute;inset:0;background:#050818bb;display:none;place-items:center;text-align:center;backdrop-filter:blur(3px)}
.overlay.show{display:grid;animation:fade .4s}@keyframes fade{from{opacity:0}}
.overlay h2{margin:0;font-size:clamp(24px,6vw,72px);text-shadow:0 0 20px #ff6cff}.overlay p{font-size:clamp(12px,1.8vw,22px);margin:.6em 0 1.2em}
.overlay button{font-size:clamp(12px,2vw,24px);font-weight:900;padding:.6em 1.4em;border-radius:16px;border:2px solid #7de7ff;background:linear-gradient(135deg,#1d3b7c,#6a2fa5);color:#fff;cursor:pointer;box-shadow:0 0 20px #52d4ff}
footer{text-align:center;color:#c7d6ef;font-size:13px;margin-top:8px}
</style>
<main><div class="stage" id="stage">
<canvas id="gl"></canvas><div id="nogl">Loading 3D scene…</div>
<div class="count" id="count">3</div>
<div class="label p">PLAYER</div><div class="label c">COMPUTER</div>
<div class="hearts p" id="hp"></div><div class="hearts c" id="hc"></div>
<div class="score p" id="sp"></div><div class="score c" id="sc"></div>
<div id="status">CHOOSE YOUR MOVE</div>
<div class="controls">
<button class="rock" data-m="rock" aria-label="Rock">✊ ROCK<small>key 1 / R</small></button>
<button class="paper" data-m="paper" aria-label="Paper">✋ PAPER<small>key 2 / P</small></button>
<button class="scissors" data-m="scissors" aria-label="Scissors">✌️ SCISSORS<small>key 3 / S</small></button>
</div>
<button class="corner" id="mute" aria-label="Toggle sound">🔊 SOUND</button>
<button class="corner" id="restart">NEW MATCH</button>
<div class="flash" id="flash"></div>
<div class="overlay" id="over"><div><h2 id="overTitle"></h2><p id="overText"></p><button id="again">PLAY AGAIN</button></div></div>
</div><footer>Pick rock, paper or scissors (click or keys 1-3 / R-P-S). Three hearts each — first to lose all hearts loses the match. Move the mouse to look around.</footer></main>

<script>
/* 3D scene placeholder until the Three.js module loads; the game works even if it never does */
window.Scene3D={_s:{g:'rock',a:'scissors',shaking:false},setHands(g,a){this._s.g=g;this._s.a=a},setShaking(on){this._s.shaking=on},reveal(){},clear(){}};
setTimeout(()=>{if(!Scene3D.ready)document.getElementById('nogl').textContent='3D scene could not load (check your connection) — you can still play.'},12000);
/* ===================== GAME LOGIC ===================== */
const $=id=>document.getElementById(id);
const stage=$('stage'),count=$('count'),statusEl=$('status'),hp=$('hp'),hc=$('hc'),flash=$('flash'),over=$('over');
const buttons=[...document.querySelectorAll('[data-m]')];
const MOVES=['rock','paper','scissors'],beats={rock:'scissors',paper:'rock',scissors:'paper'};
let p=3,c=3,busy=false,token=0,muted=false;
let stats={wins:0,losses:0,streak:0,best:0};
try{stats=Object.assign(stats,JSON.parse(localStorage.getItem('spaceRpsStats')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('spaceRpsStats',JSON.stringify(stats))}catch(e){}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* sound (generated, no files needed) */
let ac;
function beep(freq,dur=.12,type='square',vol=.08,when=0){
  if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}catch(e){}
}
const sfx={
  tick:()=>beep(440,.1),
  go:()=>beep(880,.18),
  win:()=>[523,659,784].forEach((f,i)=>beep(f,.15,'triangle',.1,i*.09)),
  lose:()=>[330,262,196].forEach((f,i)=>beep(f,.18,'sawtooth',.06,i*.1)),
  draw:()=>beep(392,.2,'triangle',.08),
  match:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.25,'triangle',.1,i*.13)),
  gameover:()=>[392,330,262,196].forEach((f,i)=>beep(f,.3,'sawtooth',.06,i*.15))
};

function render(){
  hp.textContent='♥'.repeat(p)+'♡'.repeat(3-p);hc.textContent='♥'.repeat(c)+'♡'.repeat(3-c);
  $('sp').textContent=`Matches won: ${stats.wins} · Streak: ${stats.streak} · Best: ${stats.best}`;
  $('sc').textContent=`Matches won: ${stats.losses}`;
}
function idle(){
  busy=false;Scene3D.setShaking(false);Scene3D.clear&&Scene3D.clear();Scene3D.setHands('rock','scissors');
  buttons.forEach(x=>{x.disabled=false;x.classList.remove('picked')});
  count.textContent='3';statusEl.textContent='CHOOSE YOUR MOVE';statusEl.className='';
}
function reset(){token++;p=3;c=3;over.classList.remove('show');idle();render()}
function shake(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}

async function play(choice){
  if(busy||!p||!c)return;
  busy=true;const run=++token;
  buttons.forEach(x=>{x.disabled=true;x.classList.toggle('picked',x.dataset.m===choice)});
  Scene3D.clear&&Scene3D.clear();Scene3D.setHands('rock','rock');statusEl.className='';
  const other=MOVES[Math.floor(Math.random()*3)];
  Scene3D.setShaking(true);
  for(let n=3;n>=1;n--){
    count.textContent=n;count.classList.remove('tick');void count.offsetWidth;count.classList.add('tick');
    statusEl.textContent=['ROCK…','PAPER…','SCISSORS…'][3-n];sfx.tick();
    await wait(700);if(run!==token)return;
  }
  Scene3D.setShaking(false);sfx.go();

  const win=choice===other?0:(beats[choice]===other?1:-1);
  Scene3D.setHands(choice,other);
  Scene3D.reveal(win>0?{g:'win',a:'lose'}:win<0?{g:'lose',a:'win'}:{g:'tie',a:'tie'});
  if(win>0){c--;shake(hc)}
  if(win<0){p--;shake(hp)}
  render();
  count.textContent=win>0?'✓':win<0?'✕':'=';
  const nm={rock:'ROCK',paper:'PAPER',scissors:'SCISSORS'};
  statusEl.textContent=win>0?`${nm[choice]} BEATS ${nm[other]}!`:win<0?`${nm[other]} BEATS ${nm[choice]}!`:`BOTH ${nm[choice]} — DRAW!`;
  statusEl.className=win>0?'win':win<0?'lose':'';
  flash.style.background=win>0?'#2cff86':win<0?'#ff2050':'#ffffff';
  flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
  (win>0?sfx.win:win<0?sfx.lose:sfx.draw)();

  if(!p||!c){
    const youWon=c===0;
    if(youWon){stats.wins++;stats.streak++;stats.best=Math.max(stats.best,stats.streak)}else{stats.losses++;stats.streak=0}
    save();render();count.textContent='★';
    await wait(1300);if(run!==token)return;
    $('overTitle').textContent=youWon?'🏆 YOU WIN THE MATCH!':'💥 COMPUTER WINS';
    $('overText').textContent=youWon?`Win streak: ${stats.streak} · Best: ${stats.best}`:`Matches: you ${stats.wins} – ${stats.losses} computer`;
    over.classList.add('show');(youWon?sfx.match:sfx.gameover)();$('again').focus();
    return;
  }
  await wait(1800);if(run!==token)return;
  idle();
}

buttons.forEach(b=>b.onclick=()=>play(b.dataset.m));
$('restart').onclick=reset;$('again').onclick=reset;
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 MUTED':'🔊 SOUND'};
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),m={'1':'rock',r:'rock','2':'paper',p:'paper','3':'scissors',s:'scissors'}[k];
  if(m&&!e.ctrlKey&&!e.metaKey&&!e.altKey)play(m);
  else if((k==='enter'||k===' ')&&over.classList.contains('show')){e.preventDefault();reset()}
});
idle();render();
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const API=window.Scene3D, ST0=API._s;
const cv=document.getElementById('gl'), stage=document.getElementById('stage');

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,16/9,.1,400);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.45;

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(960,540),.75,.55,.86);composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x7a80ff,0x2a0c3a,.9));
const key=new THREE.DirectionalLight(0xfff1e0,2.6);key.position.set(-4,7,7);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-5,right:5,top:5,bottom:-4,near:1,far:25});key.shadow.bias=-.0005;key.shadow.normalBias=.02;scene.add(key);
const rimP=new THREE.DirectionalLight(0xb060ff,2.2);rimP.position.set(-7,2,-5);scene.add(rimP);
const rimC=new THREE.DirectionalLight(0x3fa8ff,2.0);rimC.position.set(7,3,-4);scene.add(rimC);
const fill=new THREE.DirectionalLight(0x8090ff,.5);fill.position.set(0,-3,6);scene.add(fill);
const clashLight=new THREE.PointLight(0xffffff,0,6,1.5);clashLight.position.set(0,.9,1.6);scene.add(clashLight);

/* ---------- procedural noise (for textures) ---------- */
function h3(x,y,z){const h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return h-Math.floor(h)}
function vn(x,y,z){const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);let fx=x-ix,fy=y-iy,fz=z-iz;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);fz=fz*fz*(3-2*fz);
 const L=(a,b,t)=>a+(b-a)*t,c=(i,j,k)=>h3(ix+i,iy+j,iz+k);
 return L(L(L(c(0,0,0),c(1,0,0),fx),L(c(0,1,0),c(1,1,0),fx),fy),L(L(c(0,0,1),c(1,0,1),fx),L(c(0,1,1),c(1,1,1),fx),fy),fz)}
function fbm(x,y,z,o=5){let s=0,a=.5;for(let i=0;i<o;i++){s+=a*vn(x,y,z);x=x*2.03+1.7;y=y*2.03+9.2;z=z*2.03+3.1;a*=.5}return s}
const sstep=(a,b,x)=>{const t=Math.min(Math.max((x-a)/(b-a),0),1);return t*t*(3-2*t)};
function equirect(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),img=g.createImageData(w,h),d=img.data;
 for(let y=0;y<h;y++){const th=y/h*Math.PI,st=Math.sin(th),ct=Math.cos(th);for(let x=0;x<w;x++){const ph=x/w*Math.PI*2;const v=fn(-Math.cos(ph)*st,ct,Math.sin(ph)*st,y/h);const i=(y*w+x)*4;d[i]=v[0];d[i+1]=v[1];d[i+2]=v[2];d[i+3]=v[3]??255}}
 g.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
function sprite(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.7)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
const SPR=sprite();

/* ---------- materials ---------- */
const std=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:o.r??.55,metalness:o.m??0,emissive:o.e??0,emissiveIntensity:o.ei??1,flatShading:!!o.flat});
const phys=(color,o={})=>new THREE.MeshPhysicalMaterial({color,roughness:o.r??.4,metalness:o.m??0,clearcoat:o.cc??0,clearcoatRoughness:.1,emissive:o.e??0,emissiveIntensity:o.ei??1,envMapIntensity:o.env??1});
const M={skin:std(0xf7c2a0,{r:.62}),hair:std(0x8a4419,{r:.42}),hairD:std(0x5e2b0e,{r:.5}),
 jacket:phys(0x7a2ad6,{r:.32,cc:.4}),jacketD:std(0x48188c,{r:.5}),top:std(0x18141f,{r:.35}),pants:std(0x231a33,{r:.6}),
 trim:std(0xff4ae0,{e:0xff3ad8,ei:2.4}),cyan:std(0x40d0ff,{e:0x30c0ff,ei:2.2}),eye:phys(0x0d1430,{r:.1,cc:1}),lip:std(0xd8607a,{r:.5}),
 strap:std(0x3a2a1c,{r:.6}),lens:phys(0x5fe0ff,{r:.05,cc:1,e:0x1a8ac8,ei:1.6}),
 suit:phys(0xeeeef4,{r:.48,cc:.35}),suitD:std(0x9ca1ae,{r:.5,m:.2}),orange:phys(0xff7618,{r:.38,cc:.3}),
 visor:phys(0xd9a443,{r:.06,m:1,cc:1,env:2.2}),metal:std(0x8d95a6,{r:.3,m:.85}),panel:std(0x2ab4ff,{e:0x28b0ff,ei:2.2}),
 star:std(0xffc23a,{e:0xffa000,ei:.8}),badge:std(0x213a8c,{r:.4}),rock:std(0x6a6066,{r:.95,flat:true})};
const gloveMat=()=>({base:phys(0x27242e,{r:.38,cc:.5}),acc:phys(0x5a3494,{r:.4,cc:.3})});
const suitGlove=()=>({base:phys(0xf1f1f6,{r:.5,cc:.3}),acc:phys(0xff7618,{r:.38,cc:.3})});

/* ---------- geometry & helpers ---------- */
const G={sph:new THREE.SphereGeometry(1,40,28),cyl:new THREE.CylinderGeometry(1,1,1,32),box:new THREE.BoxGeometry(1,1,1),
 tor:new THREE.TorusGeometry(1,.22,16,64).rotateX(Math.PI/2)};
const capCache={};
function cap(r,L){const k=r+'_'+L;return capCache[k]||(capCache[k]=new THREE.CapsuleGeometry(r,L,8,16).rotateZ(-Math.PI/2).translate(L/2,0,0))}
function grp(p=[0,0,0],r=[0,0,0],s=[1,1,1]){const g=new THREE.Group();g.rotation.order='YZX';g.position.set(...p);g.rotation.set(...r);g.scale.set(...s);return g}
function mesh(geo,mat,p=[0,0,0],s=[1,1,1],r=[0,0,0]){const m=new THREE.Mesh(geo,mat);m.rotation.order='YZX';m.position.set(...p);m.scale.set(...s);m.rotation.set(...r);m.castShadow=m.receiveShadow=true;return m}
const put=(par,o)=>{par.add(o);return o};

/* ---------- hands ---------- */
const POSES={
 rock:{c:[1.55,1.62,1.62,1.55],s:[.06,.02,-.03,-.07],tz:.25,ty:-1.25,tc:.55},
 paper:{c:[.06,.03,.06,.1],s:[.2,.06,-.07,-.2],tz:1.05,ty:-.25,tc:.05},
 scissors:{c:[.05,.05,1.62,1.55],s:[.3,-.16,-.03,-.07],tz:.25,ty:-1.25,tc:.55}};
const cp=p=>JSON.parse(JSON.stringify(p));
function buildHand(mats,mirror){
 const root=grp();const hand=put(root,grp([0,0,0],[0,0,0],[mirror?-1.2:1.2,1.2,1.2]));
 put(hand,mesh(G.sph,mats.base,[0,0,0],[.27,.31,.14]));
 put(hand,mesh(G.sph,mats.acc,[.05,0,-.08],[.2,.27,.07]));
 const fingers=[];
 [[.21,.22,.19,.07],[.07,.24,.21,.076],[-.07,.22,.19,.072],[-.2,.17,.15,.064]].forEach(([y,l1,l2,r])=>{
  const j1=put(hand,grp([.22,y,0]));put(j1,mesh(cap(r,l1),mats.base));
  const j2=put(j1,grp([l1,0,0]));put(j2,mesh(cap(r*.94,l2),mats.base));fingers.push([j1,j2])});
 const t1=put(hand,grp([-.04,.24,.05]));put(t1,mesh(cap(.085,.2),mats.base));
 const t2=put(t1,grp([.2,0,0]));put(t2,mesh(cap(.08,.13),mats.base));
 put(hand,mesh(G.cyl,mats.acc,[-.3,0,0],[.21,.16,.19],[0,0,Math.PI/2]));

}
function applyPose(h){const P=h.pose;h.fingers.forEach(([j1,j2],i)=>{j1.rotation.set(0,-P.c[i],P.s[i]);j2.rotation.set(0,-P.c[i]*1.05,0)});h.thumb[0].rotation.set(0,P.ty,P.tz);h.thumb[1].rotation.set(0,-P.tc,0)}
const lerp=(a,b,t)=>a+(b-a)*t;
function blendPose(h,k){const T=POSES[h.target],P=h.pose;for(const key of['c','s'])for(let i=0;i<4;i++)P[key][i]=lerp(P[key][i],T[key][i],k);for(const key of['tz','ty','tc'])P[key]=lerp(P[key],T[key],k)}

/* ---------- characters ---------- */
function buildHero(){
 const root=grp(),body=put(root,grp()),S=G.sph;
 put(body,mesh(S,M.pants,[0,.25,0],[.55,.45,.36]));
 put(body,mesh(S,M.top,[0,1.0,.02],[.46,.72,.32]));
 put(body,mesh(S,M.jacket,[0,1.12,-.06],[.56,.7,.34]));
 for(const x of[-.2,.2])put(body,mesh(G.cyl,M.trim,[x,1.1,.27],[.022,1.05,.022],[-.12,0,x>0?-.12:.12]));
